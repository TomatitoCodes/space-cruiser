name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar
        run: |
          chmod +x gradlew
          set +e
          ./gradlew build --stacktrace 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          grep -E "error:|warning: \[removal\]" -A2 build.log | head -40 | while IFS= read -r l; do echo "::error::$l"; done
          exit $code

      - name: Subir el jar
        uses: actions/upload-artifact@v4
        with:
          name: spacecruiser-jar
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error

      # Solo en la rama mc-26.3: la release "latest-26.3" se rehace con el jar recién compilado, así el enlace
      # de descarga es siempre el mismo y no hace falta iniciar sesión ni descomprimir nada.
      - name: Publicar el jar en la release "latest-26.3"
        if: github.event_name == 'push' && github.ref == 'refs/heads/mc-26.3'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          JAR=$(ls build/libs/*.jar | grep -v -- '-sources' | head -n 1)
          gh release delete latest-26.3 --cleanup-tag --yes || true
          gh release create latest-26.3 "$JAR" \
            --title "Última compilación (Minecraft 26.3)" \
            --notes "Jar compilado desde el commit ${GITHUB_SHA::7}" \
            --target "$GITHUB_SHA"

      # Ayuda al port: saca los fuentes descompilados de Minecraft 26.3 para poder consultarlos.
      - name: Generar fuentes de Minecraft
        if: always() && github.ref == 'refs/heads/mc-26.3'
        run: |
          touch /tmp/marker
          ./gradlew genSources --stacktrace 2>&1 | tail -5 | while IFS= read -r l; do echo "::notice::$l"; done || true
          mkdir -p mcsources
          find / -newer /tmp/marker -type f -size +3M \( -name '*.jar' -o -name '*.zip' \) -not -path '/proc/*' -not -path '/tmp/*' 2>/dev/null | head -30 | while IFS= read -r f; do echo "::notice::NEW $f $(stat -c %s "$f")"; done
          find / -newer /tmp/marker -type f -size +3M -name '*sources*.jar' -not -path '/proc/*' 2>/dev/null | head -3 | while IFS= read -r f; do cp "$f" "mcsources/$(echo "$f" | md5sum | cut -c1-6)-$(basename "$f")" || true; done
          ls -la mcsources

      # Los artefactos no siempre se pueden descargar: se publican también en una rama aparte (solo para consulta).
      - name: Publicar fuentes en la rama mc-sources
        if: always() && github.ref == 'refs/heads/mc-26.3'
        run: |
          set -e
          rm -rf /tmp/src && mkdir /tmp/src && cd /tmp/src
          for j in "$GITHUB_WORKSPACE"/mcsources/*.jar; do unzip -qo "$j" -d "/tmp/src/$(basename "$j" .jar)" || true; done
          cd /tmp/src
          git init -q && git checkout -q -b mc-sources
          git config user.name "ci" && git config user.email "ci@example.com"
          git add -A && git commit -q -m "Fuentes de Minecraft 26.3 (descompiladas)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" mc-sources
