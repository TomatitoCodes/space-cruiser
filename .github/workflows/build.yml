name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar
        run: |
          chmod +x gradlew
          set +e
          ./gradlew build --stacktrace 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          grep -E "error:|warning: \[removal\]" -A2 build.log | head -40 | while IFS= read -r l; do echo "::error::$l"; done
          exit $code

      - name: Subir el jar
        uses: actions/upload-artifact@v4
        with:
          name: spacecruiser-jar
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error

      # Solo en la rama mc-26.3: la release "latest-26.3" se rehace con el jar recién compilado, así el enlace
      # de descarga es siempre el mismo y no hace falta iniciar sesión ni descomprimir nada.
      - name: Publicar el jar en la release "latest-26.3"
        if: github.event_name == 'push' && github.ref == 'refs/heads/mc-26.3'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          JAR=$(ls build/libs/*.jar | grep -v -- '-sources' | head -n 1)
          gh release delete latest-26.3 --cleanup-tag --yes || true
          gh release create latest-26.3 "$JAR" \
            --title "Última compilación (Minecraft 26.3)" \
            --notes "Jar compilado desde el commit ${GITHUB_SHA::7}" \
            --target "$GITHUB_SHA"

      # Ayuda al port: saca los fuentes descompilados de Minecraft 26.3 para poder consultarlos.
      - name: Generar fuentes de Minecraft
        if: always() && github.ref == 'refs/heads/mc-26.3'
        run: |
          ./gradlew genSources --stacktrace 2>&1 | tail -15 | while IFS= read -r l; do echo "::notice::$l"; done || true
          mkdir -p mcsources
          find / -name '*-sources.jar' -size +500k -not -path '*/build/libs/*' 2>/dev/null | head -20 | while IFS= read -r f; do echo "::notice::FOUND $f $(stat -c %s "$f")"; cp "$f" mcsources/ || true; done
          ls -la mcsources

      - name: Subir fuentes de Minecraft
        if: always() && github.ref == 'refs/heads/mc-26.3'
        uses: actions/upload-artifact@v4
        with:
          name: mc-sources
          path: mcsources/
          if-no-files-found: warn
