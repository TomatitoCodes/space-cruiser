name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar
        run: |
          chmod +x gradlew
          set +e
          ./gradlew build --stacktrace 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          grep -E "error:|warning: \[removal\]" -A2 build.log | head -40 | while IFS= read -r l; do echo "::error::$l"; done
          exit $code

      - name: Subir el jar
        uses: actions/upload-artifact@v4
        with:
          name: spacecruiser-jar
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error

      # Solo en main: la release "latest" se rehace con el jar recién compilado, así el enlace
      # de descarga es siempre el mismo y no hace falta iniciar sesión ni descomprimir nada.
      - name: Publicar el jar en la release "latest"
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          JAR=$(ls build/libs/*.jar | grep -v -- '-sources' | head -n 1)
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest "$JAR" \
            --title "Última compilación" \
            --notes "Jar compilado desde el commit ${GITHUB_SHA::7}" \
            --target "$GITHUB_SHA"
